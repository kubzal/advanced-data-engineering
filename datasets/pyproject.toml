[project]
name = "novacart-datagen"
version = "0.1.0"
description = "Generator syntetycznych danych NovaCart dla kursu Advanced Data Engineering"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
avro = ["fastavro>=1.9"]
pubsub = ["google-cloud-pubsub>=2.21"]
kafka = ["confluent-kafka>=2.4"]
postgres = ["psycopg[binary]>=3.1"]
all = [
    "fastavro>=1.9",
    "google-cloud-pubsub>=2.21",
    "confluent-kafka>=2.4",
    "psycopg[binary]>=3.1",
]

[project.scripts]
novacart = "novacart_datagen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "fastavro>=1.9",
    "pandas>=3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novacart_datagen"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
