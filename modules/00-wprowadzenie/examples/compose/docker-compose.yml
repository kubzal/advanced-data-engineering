# examples/compose/docker-compose.yml
# Lokalne „zaślepki” usług chmurowych dla kursu. Nic tu nie kosztuje i nic nie wychodzi do chmury.
#
#   docker compose up -d                       # domyślnie: emulator Pub/Sub + Kafka
#   docker compose --profile oltp up -d        # + PostgreSQL z logical decoding (moduły 25–26)
#   docker compose --profile gcs up -d         # + fake-gcs-server (atrapa Cloud Storage)
#   docker compose --profile spanner --profile bigtable up -d
#   docker compose --profile all up -d         # wszystko
#   docker compose down -v                     # zatrzymaj i usuń dane
#
# Wszystkie porty są wystawione tylko na 127.0.0.1: emulatory nie mają uwierzytelniania.

name: ade-local

x-labels: &labels
  course: ade
  module: "00"

services:
  pubsub:
    # Obraz gcloud CLI z wbudowanymi emulatorami (Pub/Sub, Bigtable, Datastore, Firestore, Spanner).
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud beta emulators pubsub start
      --project=novacart-local
      --host-port=0.0.0.0:8085
    ports:
      - "127.0.0.1:8085:8085"
    labels: *labels
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # Jeden węzeł Kafki w trybie KRaft (bez ZooKeepera): ten sam proces jest brokerem i kontrolerem.
    image: apache/kafka:4.1.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    labels: *labels

  postgres:
    # Baza transakcyjna NovaCart dla `novacart replay-oltp` i CDC (Debezium / Datastream).
    profiles: ["oltp", "all"]
    image: postgres:17
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_DB: novacart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: novacart   # tylko lokalnie; nigdy tak w chmurze
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    labels: *labels
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novacart"]
      interval: 5s
      timeout: 3s
      retries: 20

  gcs:
    # Atrapa API Cloud Storage (JSON API). Dobra do testów kodu, nie do nauki zachowania GCS.
    profiles: ["gcs", "all"]
    image: fsouza/fake-gcs-server:1.52
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443"]
    ports:
      - "127.0.0.1:4443:4443"
    labels: *labels

  spanner:
    profiles: ["spanner", "all"]
    image: gcr.io/cloud-spanner-emulator/emulator
    ports:
      - "127.0.0.1:9010:9010"   # gRPC
      - "127.0.0.1:9020:9020"   # REST
    labels: *labels

  bigtable:
    profiles: ["bigtable", "all"]
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators bigtable start --host-port=0.0.0.0:8086
    ports:
      - "127.0.0.1:8086:8086"
    labels: *labels

volumes:
  pgdata:
